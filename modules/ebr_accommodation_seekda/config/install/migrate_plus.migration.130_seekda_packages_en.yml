id: 130_seekda_packages_en
label: '130 - Seekda packages (english translation)'
migration_group: seekda
langcode: de
status: true
source:
  plugin: url
  headers:
    Accept: application/json
  data_fetcher_plugin: http
  data_parser_plugin: json
  urls:
    callback: ebr_accommodation_seekda_migration_130_seekda_packages_en
  item_selector: /result/packages
  track_changes: true
  fields:
    -
      name: package_code
      selector: code
    -
      name: package_title
      selector: title
    -
      name: teaser
      selector: teaser
    -
      name: description
      selector: description
  ids:
    package_code:
      type: string

process:
  type:
    plugin: default_value
    default_value: package
  title:
    plugin: skip_on_empty
    method: row
    source: package_title
    message: 'Title is not translated.'
  langcode:
    plugin: default_value
    default_value: en
  content_translation_source:
    plugin: default_value
    default_value: de
  nid:
    plugin: migration_lookup
    source: package_code
    migration: 120_seekda_packages_de
    no_stub: true
  uid:
    plugin: callback
    callable:
      - '\Drupal\ebr_accommodation_seekda\Seekda'
      - migrationOwnerUid
    unpack_source: true
    source: [  ]
  status:
    plugin: default_value
    default_value: 1
  sticky:
    plugin: default_value
    default_value: 0
  promote:
    plugin: default_value
    default_value: 0
  changed:
    plugin: callback
    callable: time
    unpack_source: true
    source: {  }
  field_subtitle/value: teaser
  field_subtitle/format:
    plugin: default_value
    default_value: basic_html
  body/value: description
  body/format:
    plugin: default_value
    default_value: basic_html

destination:
  plugin: 'entity:node'
  translations: true
  overwrite_properties:
    - title
    - field_subtitle
    - body
    - changed

migration_dependencies:
  required:
    - 100_seekda_rooms_de
    - 120_seekda_packages_de

dependencies:
  enforced:
    module:
      - ebr_accommodation_seekda
