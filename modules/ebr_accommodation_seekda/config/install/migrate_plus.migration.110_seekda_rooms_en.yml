id: 110_seekda_rooms_en
label: '110 - Seekda rooms (english translation)'
migration_group: seekda
langcode: de
status: true
source:
  plugin: url
  headers:
    Accept: application/json
  data_fetcher_plugin: http
  data_parser_plugin: json
  urls:
    callback: ebr_accommodation_seekda_migration_110_seekda_rooms_en
  item_selector: /result/rooms
  track_changes: true
  fields:
    -
      name: room_code
      selector: code
    -
      name: room_title
      selector: title
    -
      name: room_description
      selector: description
    -
      name: std_occupancy
      selector: std_occupancy
    -
      name: max_occupancy
      selector: max_occupancy
  ids:
    room_code:
      type: string

process:
  type:
    plugin: default_value
    default_value: room
  title:
    plugin: skip_on_empty
    method: row
    source: room_title
    message: 'Title is not translated.'
  langcode:
    plugin: default_value
    default_value: en
  content_translation_source:
    plugin: default_value
    default_value: de
  nid:
    plugin: migration_lookup
    source: room_code
    migration: 100_seekda_rooms_de
    no_stub: true
  uid:
    plugin: default_value
    default_value: 1
  status:
    plugin: default_value
    default_value: 1
  sticky:
    plugin: default_value
    default_value: 0
  promote:
    plugin: default_value
    default_value: 0
  body/value: room_description
  body/format:
    plugin: default_value
    default_value: basic_html

destination:
  plugin: 'entity:node'
  translations: true
  overwrite_properties:
    - title
    - body

migration_dependencies:
  required:
    - 100_seekda_rooms_de

dependencies:
  enforced:
    module:
      - ebr_accommodation_seekda
