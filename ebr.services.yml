services:
  _defaults:
    autowire: true
    autoconfigure: true

  Drupal\ebr\EntityBusinessrules: ~
  ebr.service:
    alias: Drupal\ebr\EntityBusinessrules
  ebr.entity_business_rules:
    alias: Drupal\ebr\EntityBusinessrules

  Drupal\ebr\Twig\EbrTwigExtension:
    tags:
      - { name: twig.extension }
  ebr.twig_extension:
    alias: Drupal\ebr\Twig\EbrTwigExtension
